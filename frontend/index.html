<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee POS</title>

    <!-- PWA — เปิดจากไอคอนบนหน้าจอโฮมแล้วได้โหมดเต็มจอ ไม่มีแถบ URL
         (แถบ URL ที่หด/กางเองคือต้นเหตุที่ทำให้จุดที่แตะกับปุ่มที่เห็นไม่ตรงกันบน iPad/iPhone)
         ไม่ตั้ง start_url ใน manifest ตั้งใจ — แต่ละเครื่องเปิดมาที่หน้าที่ตัวเองปักไว้
         (เครื่องหน้าร้านปัก / ส่วนเครื่องแอดมินปัก /admin/orders ได้) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- default (ไม่ใช่ black-translucent): เนื้อหาไม่มุดใต้ status bar จึงไม่ต้องแก้ layout/safe-area -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Coffee POS" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
