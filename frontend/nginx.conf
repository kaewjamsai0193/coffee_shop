server {
  listen 80;
  server_name _;

  # รับไฟล์อัปโหลดได้ถึง 6MB (รูปเมนูจำกัด 5MB ที่ backend) — default nginx = 1MB
  client_max_body_size 6m;

  # API → backend (ตัด prefix /api ออก: /api/menu → /menu)
  location /api/ {
    proxy_pass http://backend:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # รูปเมนู → backend (คงพาธเดิม /uploads/...)
  location /uploads/ {
    proxy_pass http://backend:4000/uploads/;
  }

  # SPA fallback
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
  }
}
